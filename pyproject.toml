[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "economics-management-research"
version = "0.1.1"
description = "Offline-first research workflow contracts for economics and management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.26.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
math = ["sympy==1.14.0", "numpy==2.3.5"]
dev = ["pytest==9.0.2", "ruff==0.13.2"]

[project.scripts]
emr = "emr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emr = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
