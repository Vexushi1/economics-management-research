name: Phase 9 Semantic Security CI (hash-locked)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install hash-locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/ci-py312-linux.lock
      - name: Install local project without dependency resolution
        run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Dependency compatibility
        run: python -m pip check
      - name: Verify PDF release pins
        run: |
          python - <<'PYCODE'
          from importlib.metadata import version
          assert version("pypdf") == "6.20.0"
          assert version("pdfplumber") == "0.11.10"
          assert version("pdfminer.six") == "20260107"
          PYCODE
      - name: Verify reviewed Ed25519 backend pin
        run: python -c "from importlib.metadata import version; assert version('cryptography') == '50.0.2'"
      - name: Static analysis
        run: python -m ruff check src tests
      - name: Verify Phase 4 SciPy version
        run: python -c "from importlib.metadata import version; assert version('scipy') == '1.17.0'"
      - name: Validate Phase 6 pinned schema mirror
        run: python -c "from pathlib import Path; assert Path('schemas/replication-report.schema.json').read_bytes() == Path('src/emr/schemas/replication-report.schema.json').read_bytes()"
      - name: Validate Phase 8 G6 schema mirror
        run: python -c "from pathlib import Path; assert Path('schemas/g6-audit.schema.json').read_bytes() == Path('src/emr/schemas/g6-audit.schema.json').read_bytes()"
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: CLI contract smoke
        run: |
          emr inspect
          emr validate
          emr plan --type analytical_game --description 'Synthetic research question'
          emr model validate tests/fixtures/phase3/stackelberg_synthetic.json
          emr model tasks tests/fixtures/phase3/stackelberg_synthetic.json
      - name: Verify wheel bundles all schemas
        run: |
          python -m pip wheel --no-deps --no-build-isolation -w /tmp/emr_wheel .
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("/tmp/emr_wheel").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              for name in (
                  "research-state.schema.json",
                  "paper-record.schema.json",
                  "literature-matrix.schema.json",
                  "model-spec.schema.json",
                  "equilibrium-result.schema.json",
                  "proposition.schema.json",
                  "verification-report.schema.json",
                  "replication-report.schema.json",
                  "g6-audit.schema.json",
              ):
                  assert f"emr/schemas/{name}" in names
          PYCODE
