name: Phase 1 consolidation - lock generation and validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Resolve Python 3.12 lockfile from declared inputs
        run: |
          python -m pip install --disable-pip-version-check uv==0.10.0
          uv pip compile requirements/ci.in --python-version 3.12 --python-platform x86_64-unknown-linux-gnu --generate-hashes --no-header --output-file requirements/ci-py312-linux.lock
          echo 'BEGIN_LOCK_B64'
          base64 -w0 requirements/ci-py312-linux.lock
          echo
          echo 'END_LOCK_B64'
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci-py312-linux.lock
      - name: Install package without uncontrolled build isolation
        run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Static analysis
        run: python -m ruff check src tests
      - name: Tests
        run: python -m pytest -q
      - name: CLI contract smoke
        run: |
          emr inspect
          emr validate
          emr plan --type analytical_game --description 'Synthetic research question'
