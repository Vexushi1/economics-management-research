name: Phase 1 CI (hash-locked)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install hash-locked Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/ci-py312-linux.lock
      - name: Install local project without dependency resolution
        run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Dependency compatibility
        run: python -m pip check
      - name: Static analysis
        run: python -m ruff check src tests
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: CLI contract smoke
        run: |
          emr inspect
          emr validate
          emr plan --type analytical_game --description 'Synthetic research question'
      - name: Verify wheel bundles schema
        run: |
          python -m pip wheel --no-deps --no-build-isolation -w /tmp/emr_wheel .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("/tmp/emr_wheel").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              assert "emr/schemas/research-state.schema.json" in archive.namelist()
          PY
